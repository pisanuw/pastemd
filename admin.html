<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — PasteMD</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="site-header">
    <a href="/dashboard.html" class="logo">PasteMD</a>
    <span class="spacer"></span>
    <span class="user-email" id="user-email"></span>
    <button class="btn btn-secondary" id="logout-btn" style="font-size:.85rem; padding:.35rem .8rem;">Sign out</button>
  </header>

  <div class="container">
    <div id="auth-error" class="alert alert-error hidden">You need admin access to view this page.</div>

    <div id="admin-panel" class="hidden">
      <div style="display:flex; align-items:center; gap:1rem; margin-bottom:1.5rem;">
        <h1 style="margin:0; font-size:1.3rem;">All posts</h1>
        <span id="post-count" style="color:var(--muted); font-size:.9rem;"></span>
      </div>

      <div class="card">
        <div id="posts-loading" class="loading"><span class="spinner"></span></div>
        <p id="posts-empty" class="hidden" style="color:var(--muted); margin:0;">No posts yet.</p>
        <table class="admin-table" id="posts-table" style="display:none;">
          <thead>
            <tr>
              <th>Title</th>
              <th>Author</th>
              <th>Date</th>
              <th style="text-align:right;">Views</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="posts-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="/static/admin.js"></script>
<site-footer data-site-footer><template shadowrootmode="open"><style>:host { display: block; box-sizing: border-box; width: 100%; grid-column: 1 / -1; align-self: stretch; clear: both; } aside { box-sizing: border-box; max-width: 46rem; margin: 2.5rem auto 0; padding: 1rem 16px 1.5rem; border-top: 1px solid color-mix(in srgb, currentColor 22%, transparent); font: 13px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; overflow-wrap: anywhere; } p { margin: 0; } .nb { white-space: nowrap; } p + p { margin-top: 0.4em; } a { color: inherit; text-decoration: underline; text-underline-offset: 2px; } a:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; } @media print { :host { display: none; } }</style><aside aria-label="About the builder"><p>HintWise builds tools like this for small businesses, startups and educators.<br>Built with Claude, guided by experts.<br>Want something like this for your own work? <span class="nb">Email <a href="mailto:builder@hintwise.org?subject=Project%20idea%20(via%20paste-md)">builder@hintwise.org</a>.</span><br>Paid projects welcome, <span class="nb">interesting ones may be done for free&nbsp;:-)</span><br>Academic page: <a href="https://pisanorg.github.io/yusuf/">https://pisanorg.github.io/yusuf/</a><br>More apps: <a href="https://studio.hintwise.org/">studio.hintwise.org</a></p><p>Yusuf Pisan, Chief Education Officer, HintWise</p></aside></template></site-footer>
</body>
</html>
